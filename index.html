<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Segurança: só arquivos deste site (nada de script embutido ou de fora). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#000000">
<title>Virada — relógio de virar</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="topo">
    <p class="marca">Virada</p>
    <nav class="tabs" role="tablist" aria-label="Partes">
      <button class="tab active" role="tab" aria-selected="true" aria-controls="clock" data-panel="clock">Relógio</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="stopwatch" data-panel="stopwatch">Cronômetro</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="timer" data-panel="timer">Temporizador</button>
    </nav>
  </header>

  <!-- ================= RELÓGIO ================= -->
  <section class="panel active" id="clock" role="tabpanel" aria-label="Relógio">
    <p class="oculto" id="horaLida" aria-live="polite"></p>
    <div class="clock" aria-hidden="true">
      <span id="meridiem">AM</span>

      <div class="flip-card" id="c-h">
        <div class="top">00</div>
        <div class="bottom">00</div>
        <div class="flip-top">00</div>
        <div class="flip-bottom">00</div>
      </div>

      <div class="flip-card" id="c-m">
        <div class="top">00</div>
        <div class="bottom">00</div>
        <div class="flip-top">00</div>
        <div class="flip-bottom">00</div>
      </div>

      <div class="seconds" id="c-s">00</div>
    </div>
    <p class="data" id="data"></p>

    <div class="controls">
      <button id="formatToggle" aria-label="Formato da hora">24h</button>
      <button id="telaCheia">Tela cheia</button>
    </div>
  </section>

  <!-- ================= CRONÔMETRO ================= -->
  <section class="panel" id="stopwatch" role="tabpanel" aria-label="Cronômetro">
    <div class="digital" id="swDisplay">00:00<span class="ms">.00</span></div>

    <div class="controls">
      <button id="swStart" class="primary">Iniciar</button>
      <button id="swLap">Volta</button>
      <button id="swReset">Zerar</button>
    </div>
    <p class="dica">Teclado: Espaço inicia/pausa · L marca volta · R zera</p>

    <ol class="laps" id="swLaps"></ol>
  </section>

  <!-- ================= TEMPORIZADOR ================= -->
  <section class="panel" id="timer" role="tabpanel" aria-label="Temporizador">
    <div class="digital" id="tmDisplay">00:00:00</div>

    <div class="timer-inputs" id="tmInputs">
      <label class="oculto" for="tmH">Horas</label>
      <input type="number" id="tmH" min="0" max="99" placeholder="hh" inputmode="numeric">
      <span aria-hidden="true">:</span>
      <label class="oculto" for="tmM">Minutos</label>
      <input type="number" id="tmM" min="0" max="59" placeholder="mm" inputmode="numeric">
      <span aria-hidden="true">:</span>
      <label class="oculto" for="tmS">Segundos</label>
      <input type="number" id="tmS" min="0" max="59" placeholder="ss" inputmode="numeric">
    </div>

    <div class="presets">
      <button data-min="1">1 min</button>
      <button data-min="5">5 min</button>
      <button data-min="10">10 min</button>
      <button data-min="25">25 min</button>
    </div>

    <div class="controls">
      <button id="tmStart" class="primary">Iniciar</button>
      <button id="tmReset">Zerar</button>
      <button id="tmStop" class="danger hidden">Parar alarme</button>
    </div>
    <p class="dica">Teclado: Espaço inicia/pausa (ou cala o alarme) · R zera</p>
  </section>

</div>

<script src="script.js" defer></script>
</body>
</html>
